
<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">

  <title>USDT Payment • BNB Smart Chain</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #050505;
      color: #fff;
    }

    .wrap {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      background:
        radial-gradient(
          circle at 50% 15%,
          #242424,
          #0a0a0a 45%,
          #050505 100%
        );
    }

    .card {
      width: 100%;
      max-width: 390px;
      border: 1px solid #5c4d1b;
      border-radius: 20px;
      background: #0c0c0c;
      padding: 25px 21px;
      box-shadow: 0 15px 45px #000;
    }

    .top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 45px;
    }

    .brand {
      font-weight: 800;
      letter-spacing: 1px;
    }

    .tag {
      font-size: 8px;
      color: #f5c400;
      border: 1px solid #6e5b18;
      padding: 5px 8px;
      border-radius: 20px;
    }

    .icon {
      width: 70px;
      height: 70px;
      margin: 0 auto 22px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #151515;
      border: 1px solid #66531a;
      font-size: 32px;
    }

    h1 {
      text-align: center;
      font-size: 30px;
      margin: 0 0 10px;
    }

    .sub {
      text-align: center;
      color: #999;
      font-size: 13px;
      line-height: 1.55;
      margin: 0 0 25px;
    }

    .box {
      border: 1px solid #5c4d1b;
      border-radius: 14px;
      background: #101010;
      padding: 20px;
    }

    .label {
      color: #caaa24;
      font-size: 9px;
      letter-spacing: 1px;
      margin-bottom: 12px;
    }

    .amount {
      font-size: 34px;
      font-weight: 800;
      text-align: center;
      margin: 8px 0 18px;
    }

    .network {
      text-align: center;
      color: #777;
      font-size: 10px;
      margin-bottom: 18px;
    }

    .recipient {
      font-size: 10px;
      color: #999;
      line-height: 1.5;
      word-break: break-all;
      background: #161616;
      border-radius: 8px;
      padding: 10px;
      margin-bottom: 16px;
    }

    button {
      width: 100%;
      border: 0;
      border-radius: 9px;
      padding: 15px;
      background: #f5c400;
      color: #111;
      font-size: 15px;
      font-weight: 800;
      cursor: pointer;
    }

    button:active {
      transform: scale(.98);
    }

    .status {
      text-align: center;
      font-size: 12px;
      color: #aaa;
      line-height: 1.5;
      margin-top: 15px;
    }

    .success {
      text-align: center;
      padding: 12px;
      color: #c8d995;
      background: #11180c;
      border: 1px solid #40501e;
      border-radius: 9px;
      font-size: 12px;
      line-height: 1.5;
      margin-top: 15px;
    }

    .footer {
      text-align: center;
      color: #555;
      font-size: 9px;
      margin-top: 22px;
    }
  </style>
</head>

<body>

  <div class="wrap">

    <div class="card">

      <div class="top">
        <div class="brand">◈ BNB CHAIN</div>
        <div class="tag">USDT PAYMENT</div>
      </div>

      <div id="app"></div>

      <div class="footer">
        BNB Smart Chain • Transparent payment
      </div>

    </div>

  </div>


<script>

  /*
    ==============================
    PAYMENT SETTINGS
    ==============================

    सिर्फ PAYMENT_AMOUNT बदलकर
    payment amount बदला जा सकता है।

    उदाहरण:
    "50"
    "100"
    "250"
    "500"

    Payment करने वाला इसे website
    से change नहीं कर सकता।
  */

  const PAYMENT_AMOUNT = "100";

  /*
    जिस wallet में payment receive करना है
  */

  const RECIPIENT =
    "0xc1400749e127b83a8fD0022ccD1Fe8c27B06dec0";


  /*
    BNB Smart Chain
  */

  const CHAIN_ID = "0x38";


  /*
    BNB Smart Chain USDT contract
  */

  const USDT =
    "0x55d398326f99059fF775485246999027B3197955";


  const app = document.getElementById("app");


  /*
    Short wallet address
  */

  function shortAddress(address) {

    return (
      address.slice(0, 8) +
      "..." +
      address.slice(-6)
    );

  }


  /*
    Main payment screen
  */

  function showHome() {

    app.innerHTML = `

      <div class="icon">
        ₮
      </div>

      <h1>
        USDT Payment
      </h1>

      <p class="sub">
        Send the requested amount securely
        on BNB Smart Chain.
      </p>

      <div class="box">

        <div class="label">
          PAYMENT AMOUNT
        </div>

        <div class="amount">
          ${PAYMENT_AMOUNT} USDT
        </div>

        <div class="network">
          Network: BNB Smart Chain
        </div>

        <div class="label">
          RECIPIENT
        </div>

        <div class="recipient">
          ${RECIPIENT}
        </div>

        <button id="pay">

          Pay ${PAYMENT_AMOUNT} USDT

        </button>

        <div
          id="status"
          class="status">
        </div>

      </div>

    `;


    document
      .getElementById("pay")
      .onclick = pay;

  }


  /*
    BNB Smart Chain पर switch
  */

  async function switchNetwork() {

    try {

      await window.ethereum.request({

        method:
          "wallet_switchEthereumChain",

        params: [
          {
            chainId: CHAIN_ID
          }
        ]

      });

    }

    catch (error) {

      /*
        अगर BSC wallet में मौजूद नहीं है
      */

      if (error.code === 4902) {

        await window.ethereum.request({

          method:
            "wallet_addEthereumChain",

          params: [

            {

              chainId: CHAIN_ID,

              chainName:
                "BNB Smart Chain",

              nativeCurrency: {

                name: "BNB",
                symbol: "BNB",
                decimals: 18

              },

              rpcUrls: [
                "https://bsc-dataseed.binance.org/"
              ],

              blockExplorerUrls: [
                "https://bscscan.com/"
              ]

            }

          ]

        });

      }

      else {

        throw error;

      }

    }

  }


  /*
    Payment function
  */

  async function pay() {

    const status =
      document.getElementById("status");


    /*
      Wallet available है या नहीं
    */

    if (!window.ethereum) {

      status.textContent =
        "Wallet नहीं मिला। Trust Wallet या MetaMask के DApp browser में यह page खोलें।";

      return;

    }


    try {

      status.textContent =
        "Connecting wallet...";


      /*
        User wallet connect करता है
      */

      const accounts =
        await window.ethereum.request({

          method:
            "eth_requestAccounts"

        });


      const from =
        accounts[0];


      /*
        BNB Smart Chain select करें
      */

      await switchNetwork();


      status.textContent =
        "Please confirm the payment in your wallet.";


      /*
        USDT में 6 decimals होते हैं।

        उदाहरण:
        100 USDT
        =
        100000000
      */

      const amountWei =

        BigInt(
          Math.round(
            Number(PAYMENT_AMOUNT) * 1e6
          )
        )

        .toString(16)
        .padStart(64, "0");


      /*
        Recipient address को
        32-byte parameter बनाया जाता है
      */

      const recipientPadded =

        RECIPIENT
          .slice(2)
          .padStart(64, "0");


      /*
        ERC-20 transfer selector

        transfer(address,uint256)
      */

      const data =
        "0xa9059cbb" +
        recipientPadded +
        amountWei;


      /*
        Wallet transaction

        User को wallet में
        transaction confirm करना होगा।
      */

      const txHash =
        await window.ethereum.request({

          method:
            "eth_sendTransaction",

          params: [

            {

              from: from,

              to: USDT,

              data: data

            }

          ]

        });


      /*
        Success screen
      */

      app.innerHTML = `

        <div class="icon">
          ✓
        </div>

        <h1>
          Payment Sent
        </h1>

        <p class="sub">
          Your wallet submitted the
          ${PAYMENT_AMOUNT} USDT payment.
        </p>

        <div class="box">

          <div class="success">

            Transaction submitted successfully.

          </div>

          <div class="recipient">

            Transaction hash:

            <br><br>

            ${txHash}

          </div>

          <button id="again">

            Done

          </button>

        </div>

      `;


      document
        .getElementById("again")
        .onclick = showHome;


    }

    catch (error) {

      status.textContent =

        error.message ||
        "Payment cancelled or failed.";

    }

  }


  /*
    Start page
  */

  showHome();

</script>

</body>
</html>
