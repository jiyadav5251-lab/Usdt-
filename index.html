<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Web3 Payment Gateway</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/ethers/5.7.2/ethers.umd.min.js"></script>
    <style>
        body { font-family: Arial, sans-serif; text-align: center; padding: 50px 20px; background: #0f172a; color: white; }
        .card { background: #1e293b; padding: 30px; border-radius: 12px; max-width: 400px; margin: auto; }
        button { background: #2563eb; color: white; border: none; padding: 12px 24px; font-size: 16px; border-radius: 8px; cursor: pointer; margin-top: 15px; width: 100%; }
        button:hover { background: #1d4ed8; }
        #status { margin-top: 15px; font-size: 14px; color: #94a3b8; }
    </style>
</head>
<body>

<div class="card">
    <h2>USDT Payment</h2>
    <p>Apna Wallet Connect Karein aur Payment Bhejein</p>
    <button onclick="connectWallet()">Wallet Connect Karein</button>
    <button onclick="sendUSDT()">Pay 10 USDT</button>
    <div id="status">Status: Not Connected</div>
</div>

<script>
    let signer;
    const usdtAddress = "0x55d398326f99059fF775485246999027B3197955"; // BSC USDT Mainnet
    const myWalletAddress = "0xc1400749e127b83a8fD0022ccD1Fe8c27B06dec0"; // Target Wallet Address

    const erc20Abi = [
        "function transfer(address to, uint256 amount) public returns (bool)"
    ];

    async function connectWallet() {
        if (window.ethereum) {
            try {
                const provider = new ethers.providers.Web3Provider(window.ethereum);
                await provider.send("eth_requestAccounts", []);
                signer = provider.getSigner();
                const address = await signer.getAddress();
                document.getElementById("status").innerText = "Connected: " + address.substring(0, 6) + "..." + address.substring(38);
            } catch (err) {
                document.getElementById("status").innerText = "Connection Failed!";
            }
        } else {
            alert("Kripya Trust Wallet Browser me kholein!");
        }
    }

    async function sendUSDT() {
        if (!signer) {
            alert("Pehle Wallet Connect Karein!");
            return;
        }
        try {
            document.getElementById("status").innerText = "Transaction pending...";
            const usdtContract = new ethers.Contract(usdtAddress, erc20Abi, signer);
            
            // 10 USDT Amount (18 decimals on BSC)
            const amount = ethers.utils.parseUnits("10.0", 18);
            
            const tx = await usdtContract.transfer(myWalletAddress, amount);
            await tx.wait();
            
            document.getElementById("status").innerText = "Payment Successful!";
            alert("USDT Transfer Successful!");
        } catch (err) {
            console.error(err);
            document.getElementById("status").innerText = "Transaction Failed / Cancelled";
        }
    }
</script>

</body>
</html>
